<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Filme</title>
    <link href="form.css" rel="stylesheet" />
    <script src="scriptform.js" defer></script>
</head>
<body>
    <div class="formulario">
        <h3>Cadastro de Filme ♰</h3>
        <p>Insira as informações do filme</p>
       
        <form id="meuFormulario">
            <label for="titulo">Título do Filme</label>
            <input type="text" id="titulo" placeholder="Ex: Interestellar" required>
           
            <label for="ano_lancamento">Ano de Lançamento</label>
            <input type="number" id="ano_lancamento" placeholder="Ex: 2014" required>
           
            <label for="sinopse">Sinopse</label>
            <textarea id="sinopse" placeholder="Escreva a sinopse do filme..." required></textarea>

            <label for="id_diretor">ID do Diretor</label>
            <input type="number" id="id_diretor" placeholder="Ex: 1" required>
           
            <button type="submit">Adicionar ⟡˖ ࣪</button>
        </form>
    </div>
</body>
</html>
