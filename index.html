<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes</title>
    <!-- Certifica-te de que o ficheiro CSS está na mesma pasta -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <!-- Banner Topo Full Width -->
    <section class="banner-carousel">
        <div class="banner-slides">
            <img src="banner1.jpg" class="slide active" alt="Banner 1">
            <img src="header1.jpg" class="slide" alt="Banner 2">
            <img src="banner2.jpg" class="slide" alt="Banner 3">
        </div>
        <div class="banner-indicators">
            <span class="indicator active"></span>
            <span class="indicator"></span>
            <span class="indicator"></span>
        </div>
    </section>

    <!-- Conteúdo principal abaixo do banner -->
    <div class="site-container">
        <header class="header">
            <h1 class="titulo">Filmes em Destaque</h1>
            <a href="form.html" class="btn-voltar">+ Cadastrar Novo</a>
        </header>

        <main>
            <!-- Onde os cards dos filmes vão aparecer -->
            <div id="colecao">
                <!-- Exemplo estático de card caso queiras ver logo a funcionar -->
                <div class="card">
                    <div class="texto">
                        <h3>Exemplo de Filme</h3>
                        <p>Esta é uma sinopse de exemplo para testar o visual do teu site com o novo tema escuro.</p>
                    </div>
                    <div class="img">
                        <img src="header1.jpg" alt="Capa do Filme">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script JavaScript para o carrossel -->
    <script src="index.js"></script>
</body>
</html>
